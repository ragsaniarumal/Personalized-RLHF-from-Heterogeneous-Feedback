[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heterogeneous-rlhf"
version = "1.0.0"
description = "Personalized RLHF and preference aggregation under heterogeneous human feedback"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.1"
]

[project.optional-dependencies]
llm = [
  "datasets>=2.18",
  "transformers>=4.40",
  "accelerate>=0.28",
  "trl>=0.9",
  "peft>=0.10"
]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
